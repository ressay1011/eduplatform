# Dependabot — actualizaciones de dependencias de EduPlatform
#
# Reglas:
# - Todo entra por `dev` (nunca directo a `main`), igual que el trabajo humano.
# - Semanal, agrupado: una PR por grupo en vez de veinte sueltas.
# - Los saltos de versión mayor de los frameworks se ignoran a propósito: se
#   hacen a mano, con su migración y sus pruebas (Next, React, Nest, Vitest).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    labels:
      - dependencias
      - automatizado
    commit-message:
      # `include: scope` añade "(deps)"; el prefijo no debe repetirlo.
      prefix: 'chore'
      include: scope
    groups:
      produccion-menor:
        dependency-type: production
        update-types:
          - minor
          - patch
      desarrollo-menor:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Política del repo: un salto de versión MAYOR se hace a mano, con su
      # migración y sus pruebas (Next, React, Nest, TypeScript, Vite…).
      # Dependabot solo propone minor y patch. `update-types` no filtra las
      # actualizaciones de seguridad: si hay una vulnerabilidad con arreglo en
      # una versión mayor, Dependabot abre igual su PR y la alerta aparece.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels:
      - dependencias
      - automatizado
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      actions:
        patterns:
          - '*'

  # La imagen de Postgres del docker-compose de desarrollo no es una dependencia
  # npm: sin este bloque, los parches de la 16 nunca se proponen.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 1
    labels:
      - dependencias
      - automatizado
    commit-message:
      prefix: 'chore'
      include: scope
    ignore:
      # Un salto de versión mayor (Postgres 17) es migración a mano, como en el
      # resto del repo; los parches de la 16 sí entran solos.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
