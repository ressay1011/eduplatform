# SonarQube / SonarCloud — EduPlatform
#
# El escáner lee este archivo desde la raíz. El servidor y el token NO se
# guardan aquí: van por entorno (SONAR_HOST_URL / SONAR_TOKEN), tanto en CI
# como en local (`%USERPROFILE%\.eduplatform\sonar.env`).
sonar.projectKey=ressay1011_eduplatform
sonar.projectName=EduPlatform
sonar.organization=ressay1011
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Dónde está el código que se analiza (tests aparte, abajo). Incluye los
# configs y el humo E2E: son código versionado que además ejecuta el CI.
sonar.sources=apps/api/src,apps/web/app,apps/web/components,apps/web/hooks,apps/web/lib,packages/types/src,packages/database/src,packages/database/scripts,scripts,apps/api/vitest.setup.ts,apps/web/vitest.setup.ts,apps/web/postcss.config.mjs,packages/database/drizzle.config.ts,e2e,eslint.config.mjs,playwright.config.ts,apps/api/vitest.config.ts,apps/web/vitest.config.ts,apps/web/next.config.ts,packages/types/vitest.config.ts,packages/database/vitest.config.ts

# Los specs viven dentro de src: se marcan como tests, no como código de app.
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/*.e2e.spec.ts

# Cobertura LCOV que genera `pnpm coverage`. El gate por defecto de SonarCloud
# exige 80 % en código nuevo y no es editable en el plan Free: se envía el dato
# real y, además, el CI exige su propio mínimo con `pnpm coverage:check`.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,packages/types/coverage/lcov.info,packages/database/coverage/lcov.info

# Los scripts operativos (bootstrap de Neon, seed, verificación de RLS,
# auditoría, preflight, escáner de Sonar) se ejecutan a mano o en CI contra una
# base real: no llevan test unitario, así que se excluyen del cálculo de
# cobertura. El gate de SonarCloud exige 80 % en código nuevo y no es editable
# en el plan Free; sin esta exclusión, cualquier script nuevo lo tumba.
sonar.coverage.exclusions=packages/database/scripts/**,scripts/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.vercel/**,**/coverage/**,**/*.d.ts

# Sonar solo analiza TypeScript/JavaScript del producto; el diseño y los docs
# quedan fuera (viven solo en local).
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,packages/types/tsconfig.json,packages/database/tsconfig.json